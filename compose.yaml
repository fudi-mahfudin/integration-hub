# Closed component list only (see issue #1). This file grows as components land;
# nothing outside the list is ever added.

# The hub image's runtime settings, shared by the hub service and the workers (profile `app`).
x-hub: &hub
  image: integration-hub/hub:local
  profiles: [app]
  depends_on:
    # The schema first (#43): a process exits 1 on a schema other than its build's.
    migrate:
      condition: service_completed_successfully
    redis:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"

x-hub-env: &hub-env
  DATABASE_URL: postgres://hub:hub@postgres:5432/hub
  REDIS_URL: redis://redis:6379
  TRACE_EXPORT_URL: http://jaeger:4318/v1/traces
  # The big run samples 5% (bigrun.commitments.json bigRun.tracing); `pnpm bigrun` sets it.
  TRACE_SAMPLE_RATIO: ${TRACE_SAMPLE_RATIO:-1}

x-worker-env: &worker-env
  <<: *hub-env
  # The mock SATUSEHAT service below (#44).
  SATUSEHAT_AUTH_URL: http://mock:3001/oauth2/v1/
  SATUSEHAT_FHIR_URL: http://mock:3001/fhir-r4/v1/
  SATUSEHAT_KFA_URL: http://mock:3001/kfa-v2/
  WORKER_PROCESSES: "2"
  # `0` turns scheduled reconciliation off, as the big run does (`pnpm bigrun` sets it).
  RECONCILIATION_INTERVAL_MS: ${RECONCILIATION_INTERVAL_MS:-900000}

services:
  postgres:
    image: postgres:17-alpine
    # Pinned big-run limits (bigrun.commitments.json bigRun.topology.composeLimits).
    cpus: 2
    mem_limit: 1g
    environment:
      POSTGRES_USER: hub
      POSTGRES_PASSWORD: hub
      POSTGRES_DB: hub
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hub -d hub"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    cpus: 0.5
    mem_limit: 256m
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Scrapes the hub service and the workers running on the host every 5s (#41).
  prometheus:
    image: prom/prometheus:v3.5.0
    cpus: 0.5
    mem_limit: 512m
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:9090/-/ready"]
      interval: 2s
      timeout: 3s
      retries: 30

  # The three provisioned dashboards (#41): Hub overview, Worker & outbox, Upstreams & cache. No alerting.
  grafana:
    image: grafana/grafana:12.1.0
    depends_on:
      prometheus:
        condition: service_healthy
    environment:
      # Local only: anyone reaching the port may view; dashboards are read-only from committed JSON.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_UNIFIED_ALERTING_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/hub-overview.json
    volumes:
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-3300}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 2s
      timeout: 3s
      retries: 30

  # Trace backend (#42): OTLP/HTTP on 4318 from the hub service and workers on the host, UI on 16686.
  # In-memory storage: traces are lost on restart; the big run samples 5% so it stays bounded.
  jaeger:
    image: jaegertracing/jaeger:2.20.0
    cpus: 1
    mem_limit: 1g
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_PORT:-4318}:4318"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:13133/status"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot: applies pending migrations, then exits; the hub service and workers wait for it (#43).
  migrate:
    build:
      context: .
      dockerfile: apps/hub/Dockerfile
    image: integration-hub/hub:local
    profiles: [app]
    command: ["node", "dist/db/migrate-cli.js"]
    environment:
      DATABASE_URL: postgres://hub:hub@postgres:5432/hub
    depends_on:
      postgres:
        condition: service_healthy

  # Pinned big-run limits (bigrun.commitments.json bigRun.topology.composeLimits).
  hub:
    <<: *hub
    cpus: 1
    mem_limit: 512m
    environment:
      <<: *hub-env
    ports:
      - "${HUB_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    # The hub service drains for up to 10s (#43); Docker's 10s default would SIGKILL it first.
    stop_grace_period: 15s

  worker-1:
    <<: *hub
    cpus: 1
    mem_limit: 512m
    command: ["node", "--import", "./dist/instrumentation.js", "dist/worker-main.js"]
    environment:
      <<: *worker-env
      WORKER_PORT: "3002"
    ports:
      - "3002:3002"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3002/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    # A worker drains for up to 70s (#43); Docker's 10s default would SIGKILL it mid-attempt.
    stop_grace_period: 80s

  worker-2:
    <<: *hub
    cpus: 1
    mem_limit: 512m
    command: ["node", "--import", "./dist/instrumentation.js", "dist/worker-main.js"]
    environment:
      <<: *worker-env
      WORKER_PORT: "3003"
    ports:
      - "3003:3003"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3003/readyz"]
      interval: 2s
      timeout: 3s
      retries: 30
    stop_grace_period: 80s

  # The mock SATUSEHAT (#44): in memory, so a restart empties it. Never deploy it publicly: `/__mock/*` has no auth.
  # Its port is published for the inspection API (`/__mock/report`, `/__mock/log`).
  # Pinned big-run limits (bigrun.commitments.json bigRun.topology.composeLimits).
  mock:
    build:
      context: .
      dockerfile: packages/mock-satusehat/Dockerfile
    image: integration-hub/mock-satusehat:local
    profiles: [app]
    cpus: 1
    mem_limit: 512m
    ports:
      - "${MOCK_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/__mock/report"]
      interval: 2s
      timeout: 3s
      retries: 30

  # One-shot (#44): plans one seeded batch from the world dataset, sends it to the hub as the
  # development source system, waits for every case to complete, then exits (1 if any check failed).
  # The SIM_* variables shape the batch (packages/simulator/README.md); `pnpm stack:up` runs it.
  simulator:
    build:
      context: .
      dockerfile: packages/simulator/Dockerfile
    image: integration-hub/simulator:local
    profiles: [simulator]
    environment:
      HUB_URL: http://hub:3000/
      SIM_SEED: ${SIM_SEED:-44}
      SIM_VISITS: ${SIM_VISITS:-20}
    depends_on:
      hub:
        condition: service_healthy
      worker-1:
        condition: service_healthy
      worker-2:
        condition: service_healthy
      mock:
        condition: service_healthy
